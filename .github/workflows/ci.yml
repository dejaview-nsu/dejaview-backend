name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# новый коммит отменяет проверку старого
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dockerfile: ${{ steps.files.outputs.dockerfile }}
      migrations: ${{ steps.files.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: |
          echo "dockerfile=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "migrations=$(compgen -G 'db/migrations/*.sql' >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-20

      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z '*.cpp' '*.cc' '*.h' '*.hpp')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::C++ файлов в репозитории нет"
            exit 0
          fi
          if [ ! -f .clang-format ]; then
            echo "::error::Нет файла .clang-format"
            exit 1
          fi
          clang-format-20 --dry-run --Werror "${files[@]}"

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build libmagic-dev
          pipx install conan==2.33.0

      - name: Restore Conan cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-gcc14-${{ hashFiles('conanfile.txt', 'conan.lock') }}

      - name: Install dependencies
        run: |
          conan profile detect --exist-ok
          conan install . --lockfile=conan.lock --output-folder=build --build=missing -s compiler.cppstd=23

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake

      - name: Build
        run: cmake --build build --parallel

      - name: Pack build directory
        run: tar -cf build.tar build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build.tar
          retention-days: 1

  test:
    name: test
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build

      - name: Unpack build directory
        run: tar -xf build.tar

      - name: Install libmagic
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1t64

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=ignore

  check-migrations:
    name: check-migrations
    needs: [detect]
    if: needs.detect.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_DB: dejaview_test
          POSTGRES_USER: dejaview
          POSTGRES_PASSWORD: dejaview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dejaview -d dejaview_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply, roll back and re-apply migrations
        env:
          DATABASE_URL: postgres://dejaview:dejaview@localhost:5432/dejaview_test?sslmode=disable
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          dbmate() {
            docker run --rm --network host \
              -v "$GITHUB_WORKSPACE/db:/db" \
              -e DATABASE_URL \
              -e DBMATE_NO_DUMP_SCHEMA=true \
              ghcr.io/amacneil/dbmate:2.36.0 "$@"
          }
          query() { docker exec "$PG_CONTAINER" psql -U dejaview -d dejaview_test -Atc "$1"; }
          applied() { query "select count(*) from schema_migrations"; }
          tables() { query "select count(*) from information_schema.tables where table_schema = 'public' and table_name <> 'schema_migrations'"; }

          dbmate up
          dbmate status --exit-code

          while true; do
            left=$(applied)
            if [ "$left" -eq 0 ]; then break; fi
            dbmate rollback
          done

          left_tables=$(tables)
          if [ "$left_tables" -ne 0 ]; then
            echo "::error::После отката всех миграций в базе осталось таблиц: $left_tables"
            exit 1
          fi

          dbmate up
          dbmate status --exit-code

  build-image:
    name: build-image
    needs: [detect, format, test, check-migrations]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.dockerfile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc') }}

      - name: Login to GHCR
        if: steps.meta.outputs.tags != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ steps.meta.outputs.tags != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
